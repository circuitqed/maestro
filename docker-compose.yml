version: "3.8"

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: maestro
    pid: "host"  # Required for tmux session attachment
    ports:
      - "7007:5000"
    volumes:
      - ./data:/app/data
      - /tmp:/tmp  # For tmux sockets (/tmp/tmux-<uid>)
      - /etc/passwd:/etc/passwd:ro
      - /etc/group:/etc/group:ro
      - /home/dave:/home/dave
      - /home/projects:/home/projects
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - NODE_ENV=production
      - SESSION_SECRET=${SESSION_SECRET:-maestro-secret-change-in-production}
      - HOME=/home/dave
    user: "1005:1005"
    group_add:
      - "119"  # docker group - needed for /var/run/docker.sock access
    restart: unless-stopped
